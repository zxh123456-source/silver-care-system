name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  startup-windows:
    name: Windows / startup ownership + recovery
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Parse PowerShell entry points
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in Get-ChildItem -LiteralPath . -Filter '*.ps1' -File) {
            $tokens = $null
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw "$($file.Name): $($errors.Message -join '; ')" }
          }
      - name: Verify lifecycle safety with real owned processes
        shell: pwsh
        run: python -m unittest discover -s tools -p test_startup.py -v

  database:
    name: Database / migrations + isolated restore
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify backup validation and recovery boundaries
        run: python -m unittest discover -s tools -p test_database.py
      - name: Verify real migrations, failures, lock contention and restore
        run: python .github/database/check.py --disposable-test
      - name: Upload database verification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: database-verification
          path: |
            .runtime/database-check/**/*.json
            .runtime/database-check/**/*.txt
          if-no-files-found: warn
          retention-days: 7

  backend:
    name: Backend / MySQL + Redis integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: 源码/beadhouse-backend
        shell: bash
    env:
      TZ: Asia/Shanghai
      # Disposable CI fixtures only; no application or repository secrets are used.
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-bytes
      LEGACY_AES_IV: test-fixture-iv!
      LEGACY_AES_KEY: test-fixture-key
      SCOPE_TEST_DB_URL: jdbc:mysql://127.0.0.1:13318/db_beadhouse?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SCOPE_TEST_DB_PASSWORD: scope-test-only
      SCOPE_HTTP_REDIS_PORT: '16390'
      RESET_TEST_REDIS_PORT: '16391'
      DAILY_HTTP_TEST: 'true'
      ALERT_HTTP_TEST: 'true'
      FILESAVE_LINUX: ./target/scope-exports
    services:
      mysql:
        image: mysql:8.0.40
        env:
          MYSQL_ROOT_PASSWORD: scope-test-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: db_beadhouse
          TZ: Asia/Shanghai
        ports:
          - 13318:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pscope-test-only --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=40
      reset-redis:
        image: redis:7.4.2-alpine
        ports:
          - 16391:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          cache-dependency-path: 源码/beadhouse-backend/pom.xml
      - name: Initialize disposable database and authenticated Redis
        working-directory: .
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
          MYSQL_PWD: scope-test-only
        run: |
          set -euo pipefail
          docker exec "$MYSQL_CONTAINER" mkdir -p /opt/silvercare/database
          docker cp 数据库/. "$MYSQL_CONTAINER:/opt/silvercare/database"
          docker exec -e MYSQL_PWD "$MYSQL_CONTAINER" bash /opt/silvercare/database/migrate.sh initialize
          docker exec -e MYSQL_PWD "$MYSQL_CONTAINER" bash /opt/silvercare/database/migrate.sh inspect
          docker run -d --name silvercare-ci-redis --publish 127.0.0.1:16390:6379 \
            redis:7.4.2-alpine redis-server --requirepass scope-redis-only
          for attempt in $(seq 1 30); do
            if docker exec silvercare-ci-redis redis-cli --no-auth-warning -a scope-redis-only ping | grep -q PONG; then
              exit 0
            fi
            sleep 1
          done
          echo 'Authenticated Redis did not become ready' >&2
          exit 1
      - name: Build and run all backend tests
        run: mvn --batch-mode --no-transfer-progress -Dfile.encoding=UTF-8 verify
      - name: Require all seventeen integration suites to execute
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          required = (
              'DemoAccountInitializerIntegrationTest',
              'LegacyScopeSqlIntegrationTest',
              'LegacyScopeHttpIntegrationTest',
              'DailyTaskHttpIntegrationTest',
              'CareAlertHttpIntegrationTest',
              'CareAlertConcurrencyHttpIntegrationTest',
              'AlertAutomationHttpIntegrationTest',
              'PolicyRagSyncHttpIntegrationTest',
              'ElderPaginationHttpIntegrationTest',
              'PasswordResetGuardIntegrationTest',
              'AuthLifecycleHttpIntegrationTest',
              'FileUploadHttpIntegrationTest',
              'AttachmentAccessHttpIntegrationTest',
              'BedLifecycleHttpIntegrationTest',
              'BillingHttpIntegrationTest',
              'AdmissionScopeHttpIntegrationTest',
              'RechargeHttpIntegrationTest',
          )
          reports = Path('target/surefire-reports')
          for suite in required:
              matches = list(reports.glob(f'TEST-*.{suite}.xml'))
              if len(matches) != 1:
                  raise SystemExit(f'Missing or ambiguous report: {suite}')
              result = ET.parse(matches[0]).getroot()
              if int(result.get('tests', '0')) == 0 or any(
                  int(result.get(key, '0')) for key in ('skipped', 'failures', 'errors')
              ):
                  raise SystemExit(f'Integration suite did not pass without skips: {suite}')
              print(f'Executed and passed: {suite}')
          PY
      - name: Upload verified backend for browser tests
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: backend-app
          path: 源码/beadhouse-backend/target/beadhouse-backend-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 1
      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: backend-test-reports
          path: |
            源码/beadhouse-backend/target/surefire-reports/
            源码/beadhouse-backend/target/care-alert-concurrency-innodb.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Remove authenticated test Redis
        if: always()
        run: docker rm -f silvercare-ci-redis || true

  frontend:
    name: Frontend / clean install + build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: 源码/beadhouse-frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: 源码/beadhouse-frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify recharge intent and session boundaries
        run: npm run test:recharge
      - name: Verify authenticated resources and binary errors
        run: npm run test:resources
      - name: Verify bed lifecycle form contracts
        run: npm run test:bed
      - name: Verify notification polling, scope and sessions
        run: npm run test:notifications
      - name: Verify UI lifecycle, response races and form sessions
        run: npm run test:ui-recovery
      - name: Build with TypeScript and ESLint checks
        run: npm run build
      - name: Upload verified frontend for browser tests
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frontend-dist
          path: 源码/beadhouse-frontend/dist/
          if-no-files-found: error
          retention-days: 1

  browser:
    name: Browser / end-to-end
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
      PYTHONUTF8: '1'
    services:
      mysql:
        image: mysql:8.0.40
        env:
          MYSQL_ROOT_PASSWORD: scope-test-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: db_beadhouse
          TZ: Asia/Shanghai
        ports:
          - 13318:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pscope-test-only --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/e2e/requirements.txt
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: backend-app
          path: 源码/beadhouse-backend/target/
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: frontend-dist
          path: 源码/beadhouse-frontend/dist/
      - name: Install browser test dependencies
        run: |
          python -m pip install -r .github/e2e/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run real browser workflows against disposable services
        env:
          E2E_MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: python .github/e2e/run.py --disposable-test
      - name: Upload browser evidence and failure traces
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-e2e-evidence
          path: .runtime/e2e/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  python:
    name: Python / dependencies + tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # All credentials below belong only to this disposable CI Compose project.
      MYSQL_ROOT_PASSWORD: unused-ci-mysql-only
      REDIS_PASSWORD: unused-ci-redis-only
      MINIO_ROOT_USER: ci-rag
      MINIO_ROOT_PASSWORD: ci-minio-fixture-password-32-bytes
      MILVUS_ROOT_PASSWORD: ci-milvus-fixture-password-32-bytes
      RAG_TEST_MILVUS_URI: http://127.0.0.1:19530
      RAG_TEST_MILVUS_TOKEN: root:ci-milvus-fixture-password-32-bytes
    defaults:
      run:
        working-directory: 源码/beadhouse-ai
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 源码/beadhouse-ai/requirements*.txt
      - name: Install full service dependencies
        run: python -m pip install -r requirements.txt
      - name: Start authenticated Milvus for real RAG regression
        working-directory: .
        run: docker compose -p silvercare-rag-ci up -d --wait --wait-timeout 180 milvus
      - name: Test settings, retrieval and injection guards
        run: python -m pytest -q --junitxml=test-results/pytest.xml
      - name: Require real Milvus consistency tests to execute
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          required = (
              'test_real_milvus_preparation_failure_and_disk_failure_preserve_index_then_retry',
              'test_real_latest_version_survives_late_old_vector_write_and_old_delete',
              'test_real_delete_tombstone_filters_late_immutable_upsert_after_restart',
              'test_real_failed_embedding_keeps_previous_rows_but_only_current_pending_text_is_returned',
              'test_real_recreated_collection_rejects_cached_ack_and_repairs_same_version',
              'test_forked_backend_resets_inherited_lock_and_reconnects_inherited_remote',
          )
          results = list(ET.parse('test-results/pytest.xml').iter('testcase'))
          for name in required:
              cases = [case for case in results if case.get('name') == name]
              assert len(cases) == 1, f'Missing real Milvus regression: {name}'
              assert not any(cases[0].find(tag) is not None for tag in ('skipped', 'failure', 'error')), f'Real Milvus regression did not pass: {name}'
              print(f'Real Milvus regression executed and passed: {name}')
          PY
      - name: Require isolated real BGE and Milvus quality baseline
        run: python run_rag_baseline.py --disposable-test --backend milvus --report-dir evals/reports/ci
      - name: Upload Python test report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: python-test-reports
          path: |
            源码/beadhouse-ai/test-results/pytest.xml
            源码/beadhouse-ai/evals/reports/ci/**/report.json
            源码/beadhouse-ai/evals/reports/ci/**/report.xml
            源码/beadhouse-ai/evals/reports/ci/**/service.log
          if-no-files-found: warn
          retention-days: 7
      - name: Remove disposable RAG infrastructure
        if: always()
        working-directory: .
        run: docker compose -p silvercare-rag-ci down --volumes
